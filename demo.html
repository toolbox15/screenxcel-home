<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScreenXcel | Football Fever Demo</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            background-color: #050505;
            /* Background alignment: Text is at the top, grid follows below */
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('images/football-bg.png');
            background-size: 100% auto; 
            background-position: center top 50px; 
            background-attachment: fixed;
            background-repeat: no-repeat;
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            border-bottom: 2px solid #69be28;
            z-index: 50;
        }

        .agency-logo { width: 90px; height: auto; }

        /* Fixed Dimensions: 3 columns of 173px (519px) and 3 rows of 170px (510px) */
        .container { 
            position: relative; 
            width: 519px; 
            height: 510px; 
            /* Responsive scaling for mobile */
            max-width: 92vw;
            height: auto;
            aspect-ratio: 519 / 510;
            margin-top: 240px; 
            background: transparent; 
            border: 4px solid #69be28; 
            border-radius: 12px; 
            box-shadow: 0 0 50px rgba(105, 190, 40, 0.4); 
            overflow: hidden;
            user-select: none;
        }

        #prize-grid { 
            position: absolute; 
            inset: 0;
            z-index: 5; 
            display: grid;
            /* Explicitly define the 173x170 cells */
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            background: transparent;
        }

        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(105, 190, 40, 0.1);
            width: 100%;
            height: 100%;
            padding: 0;
            overflow: hidden;
        }

        /* Match win/loss icons exactly to the tab size */
        .grid-cell img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        /* Scratch Layer: Overlaid with matching resolution for precise hit-testing */
        #scratch-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
            cursor: pointer; 
            touch-action: none; 
        }

        .status-bar {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .instruction-pill {
            background: #69be28;
            color: #000;
            padding: 12px 40px;
            border-radius: 99px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(105, 190, 40, 0.3);
        }

        .attempts-text {
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            color: #69be28;
            letter-spacing: 2px;
        }

        #game-over-section, #claim-section { 
            display: none; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            text-align: center; 
            width: 100%; 
            z-index: 100; 
        }

        .btn {
            background: #ffffff;
            color: #000;
            padding: 20px 45px;
            border-radius: 12px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            display: inline-block;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            font-size: 18px;
            border: 2px solid #69be28;
            cursor: pointer;
        }

        .btn-retry {
            background: #222;
            color: #fff;
            border-color: #444;
            margin-top: 15px;
        }
    </style>
</head>
<body scroll="no">

    <div class="app-header">
        <img src="images/logo.png" alt="ScreenXcel" class="agency-logo">
    </div>

    <div class="container">
        <div id="prize-grid"></div>
        <!-- Internal resolution matches our 3x173 width and 3x170 height logic -->
        <canvas id="scratch-canvas" width="519" height="510"></canvas>
    </div>

    <div class="status-bar" id="status-bar">
        <div id="instruction" class="instruction-pill">Match 3 To Win</div>
        <div class="attempts-text" id="attempts-display">Turns Left: 3</div>
    </div>

    <div id="claim-section">
        <h2 style="font-style: italic; font-weight: 900; margin-bottom: 20px; text-shadow: 0 0 20px #69be28; font-size: 32px;">TOUCHDOWN!</h2>
        <a href="https://ig.me/m/screenxcel?text=I%20FOUND%20ALL%203%20FOOTBALLS!" class="btn">
            Claim Your Reward
        </a>
    </div>

    <div id="game-over-section">
        <h2 style="font-style: italic; font-weight: 900; margin-bottom: 20px; color: #ff4444; font-size: 32px;">TURNOVER!</h2>
        <div class="btn btn-retry" onclick="location.reload()">Try Again</div>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const claimSection = document.getElementById('claim-section');
        const gameOverSection = document.getElementById('game-over-section');
        const attemptsDisplay = document.getElementById('attempts-display');
        const prizeGrid = document.getElementById('prize-grid');

        const canvasW = 519; 
        const canvasH = 510;
        const cellW = 173;
        const cellH = 170;

        let attemptsLeft = 3;
        let winsFound = 0;
        let revealedIndices = new Set();
        let isGameOver = false;

        const zones = [];
        const prizeData = []; 

        for(let r=0; r<3; r++) {
            for(let c=0; c<3; c++) {
                zones.push({
                    x: c * cellW,
                    y: r * cellH,
                    w: cellW,
                    h: cellH
                });
            }
        }

        function setupPrizes() {
            prizeGrid.innerHTML = '';
            const items = [
                { type: 'win', src: 'images/icon-win.png' },
                { type: 'win', src: 'images/icon-win.png' },
                { type: 'win', src: 'images/icon-win.png' },
                { type: 'lose', src: 'images/icon-lose.png' },
                { type: 'lose', src: 'images/icon-lose.png' },
                { type: 'lose', src: 'images/icon-lose.png' },
                { type: 'lose', src: 'images/icon-lose.png' },
                { type: 'lose', src: 'images/icon-lose.png' },
                { type: 'lose', src: 'images/icon-lose.png' }
            ];
            
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }

            items.forEach((item, i) => {
                prizeData[i] = item.type;
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                const img = document.createElement('img');
                img.src = item.src;
                cell.appendChild(img);
                prizeGrid.appendChild(cell);
            });
        }

        const cover = new Image();
        cover.src = 'images/football-cover.png';
        cover.onload = () => { 
            ctx.drawImage(cover, 0, 0, canvasW, canvasH); 
        };

        function getCellIndex(x, y) {
            const col = Math.floor(x / cellW);
            const row = Math.floor(y / cellH);
            if (col >= 0 && col < 3 && row >= 0 && row < 3) {
                return row * 3 + col;
            }
            return -1;
        }

        function handleInteraction(e) {
            if (isGameOver || attemptsLeft <= 0) return;

            const rect = canvas.getBoundingClientRect();
            const clientX = (e.touches ? e.touches[0].clientX : e.clientX);
            const clientY = (e.touches ? e.touches[0].clientY : e.clientY);
            
            const x = (clientX - rect.left) * (canvasW / rect.width);
            const y = (clientY - rect.top) * (canvasH / rect.height);
            
            const index = getCellIndex(x, y);
            
            if (index !== -1 && !revealedIndices.has(index)) {
                revealCell(index);
            }
        }

        function revealCell(index) {
            revealedIndices.add(index);
            attemptsLeft--;
            attemptsDisplay.innerText = `Turns Left: ${attemptsLeft}`;

            const zone = zones[index];
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillRect(zone.x, zone.y, zone.w, zone.h);

            if (prizeData[index] === 'win') {
                winsFound++;
            }

            checkGameState();
        }

        function checkGameState() {
            if (winsFound === 3) {
                isGameOver = true;
                setTimeout(() => {
                    canvas.style.opacity = '0';
                    canvas.style.pointerEvents = 'none';
                    canvas.style.transition = 'opacity 0.6s ease';
                    document.getElementById('status-bar').style.display = 'none';
                    claimSection.style.display = 'block';
                }, 400);
            } else if (attemptsLeft === 0) {
                isGameOver = true;
                setTimeout(() => {
                    canvas.style.opacity = '0.3';
                    document.getElementById('status-bar').style.display = 'none';
                    gameOverSection.style.display = 'block';
                }, 400);
            }
        }

        setupPrizes();

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleInteraction(e); }, { passive: false });
        canvas.addEventListener('mousedown', (e) => { handleInteraction(e); });
    </script>
</body>
</html>
