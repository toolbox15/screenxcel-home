<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ScreenXcel | Football Fever Demo</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; 
            background-color: #050505;
            /* Main Background: Stadium image should be visible through the grid */
            background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('images/football-bg.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }

        .app-header {
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            display: flex;
            justify-content: center;
            border-bottom: 2px solid #69be28;
            z-index: 50;
        }

        .agency-logo { width: 90px; height: auto; }

        /* Push the container down significantly to clear background text */
        .container { 
            position: relative; 
            width: 310px; 
            height: 310px; 
            margin-top: 180px; /* Pushes the grid down below background text */
            background: transparent; 
            border: 4px solid #69be28; 
            border-radius: 20px; 
            box-shadow: 0 0 40px rgba(105, 190, 40, 0.4); 
            overflow: hidden;
            user-select: none;
        }

        /* Visual Prize Grid: Transparent background */
        #prize-grid { 
            position: absolute; 
            inset: 0;
            z-index: 5; 
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            background: transparent;
        }

        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(105, 190, 40, 0.1);
            padding: 0; /* Removed padding so icons match cover grid size */
        }

        .grid-cell img { 
            width: 100%; /* Match width of the grid cell exactly */
            height: 100%; /* Match height of the grid cell exactly */
            object-fit: contain; 
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.8));
        }

        /* Scratch Layer: Perfectly overlaid */
        #scratch-canvas { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
            cursor: crosshair; 
            touch-action: none; 
        }

        .instruction-pill {
            margin-top: 30px;
            background: #69be28;
            color: #000;
            padding: 14px 40px;
            border-radius: 99px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 15px;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(105, 190, 40, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(105, 190, 40, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(105, 190, 40, 0.6); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(105, 190, 40, 0.4); }
        }

        #claim-section { 
            display: none; 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            text-align: center; 
            width: 100%; 
            z-index: 100; 
        }

        .win-btn {
            background: #ffffff;
            color: #000;
            padding: 22px 45px;
            border-radius: 16px;
            font-weight: 900;
            text-decoration: none;
            text-transform: uppercase;
            display: inline-block;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            font-size: 18px;
            border: 2px solid #69be28;
        }
    </style>
</head>
<body scroll="no">

    <div class="app-header">
        <img src="images/logo.png" alt="ScreenXcel" class="agency-logo">
    </div>

    <!-- Title is already in football-bg.png, so we provide space for it via margin-top on .container -->

    <div class="container">
        <div id="prize-grid"></div>
        <canvas id="scratch-canvas" width="600" height="600"></canvas>
    </div>

    <div id="instruction" class="instruction-pill">Match 3 To Win</div>

    <div id="claim-section">
        <a href="https://ig.me/m/screenxcel?text=I%20WON%20THE%20FOOTBALL%20FEVER!" class="win-btn">
            Claim Your Reward
        </a>
    </div>

    <script>
        const canvas = document.getElementById('scratch-canvas');
        const ctx = canvas.getContext('2d');
        const claim = document.getElementById('claim-section');
        const instruction = document.getElementById('instruction');
        const prizeGrid = document.getElementById('prize-grid');

        const canvasRes = 600; 
        const zones = [];
        const cellSize = canvasRes / 3;
        const pad = 5; // Reduced padding for hitboxes to match the full-cell icons

        // Pre-calculate the 9 grid zones for the 600x600 canvas
        for(let r=0; r<3; r++) {
            for(let c=0; c<3; c++) {
                zones.push({
                    x: c * cellSize + pad,
                    y: r * cellSize + pad,
                    w: cellSize - (pad * 2),
                    h: cellSize - (pad * 2)
                });
            }
        }

        function setupPrizes() {
            prizeGrid.innerHTML = '';
            const items = [
                'images/icon-win.png', 'images/icon-win.png', 'images/icon-win.png',
                'images/icon-lose.png', 'images/icon-lose.png', 'images/icon-lose.png',
                'images/icon-lose.png', 'images/icon-lose.png', 'images/icon-lose.png'
            ];
            
            for (let i = items.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [items[i], items[j]] = [items[j], items[i]];
            }

            items.forEach(src => {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                const img = document.createElement('img');
                img.src = src;
                cell.appendChild(img);
                prizeGrid.appendChild(cell);
            });
        }

        const cover = new Image();
        cover.src = 'images/football-cover.png';
        cover.onload = () => { 
            ctx.drawImage(cover, 0, 0, canvasRes, canvasRes); 
        };

        function isInsideTab(x, y) {
            return zones.some(z => x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h);
        }

        function scratch(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const x = (clientX - rect.left) * (canvasRes / rect.width);
            const y = (clientY - rect.top) * (canvasRes / rect.height);
            
            if (isInsideTab(x, y)) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath(); 
                ctx.arc(x, y, 48, 0, Math.PI * 2); 
                ctx.fill();
                checkProgress();
            }
        }

        function checkProgress() {
            let revealedCount = 0;
            zones.forEach(z => {
                const data = ctx.getImageData(z.x + (z.w/2), z.y + (z.h/2), 1, 1).data;
                if (data[3] === 0) revealedCount++;
            });

            if (revealedCount >= 8) {
                canvas.style.opacity = '0';
                canvas.style.pointerEvents = 'none';
                canvas.style.transition = 'opacity 0.8s ease';
                instruction.style.display = 'none';
                claim.style.display = 'block';
            }
        }

        setupPrizes();
        canvas.addEventListener('touchstart', (e) => { scratch(e); }, { passive: false });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); scratch(e); }, { passive: false });
        canvas.addEventListener('mousedown', (e) => { if(e.buttons === 1) scratch(e); });
        canvas.addEventListener('mousemove', (e) => { if(e.buttons === 1) scratch(e); });
    </script>
</body>
</html>
